upstream nti_api {
    server api:8090;
}

upstream nti_web {
    server web:3030;
}

# ── nti.localhost:3030  →  Vite dev server (frontend) ──
server {
    listen 3030 default_server;
    listen [::]:3030 default_server;
    server_name nti.localhost localhost;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Serve campaign image uploads from the API container so they share the
    # web origin (PUBLIC_WEB_URL) — keeps URLs simple for the share link.
    location /uploads/ {
        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;
    }

    location / {
        proxy_pass http://nti_web;
        include /etc/nginx/snippets/proxy_common.conf;

        # Long timeouts so Vite HMR websockets stay open.
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_cache_bypass $http_upgrade;
    }
}

# ── api.nti.localhost:8090  →  FastAPI ──
server {
    listen 8090 default_server;
    listen [::]:8090 default_server;
    server_name api.nti.localhost;

    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # When nginx returns 429 directly (limit_req) it bypasses FastAPI's CORS
    # middleware. Re-attach CORS headers so the browser surfaces the 429.
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Content-Type"        always;
        add_header Vary                         "Origin"              always;
        add_header Retry-After                  "1"                   always;
        return 429 '{"detail":"rate_limited"}';
    }

    # Throttle public POST endpoints.
    location ~ ^/api/(donations|contact|volunteer) {
        limit_req       zone=api_post burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

# Refuse unknown Host headers on these ports.
server {
    listen 3030;
    listen 8090;
    server_name _;
    return 444;
}
