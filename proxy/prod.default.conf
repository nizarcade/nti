# Production proxy config — public edge on :80.
# Routes:
#   /api/*       → FastAPI (with rate-limiting on public POST endpoints)
#   /uploads/*   → FastAPI (shared origin for campaign images)
#   everything else → web container (nginx serving the built SPA)

upstream nti_api {
    server api:8090;
    keepalive 16;
}

upstream nti_web {
    server web:80;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25m;

    # Security headers (web container also sets them, harmless to repeat).
    add_header X-Frame-Options        "DENY"                              always;
    add_header X-Content-Type-Options "nosniff"                           always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"   always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # Health endpoint for uptime checks / load balancers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Campaign image uploads served from API container.
    location /uploads/ {
        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;
    }

    # When nginx returns 429 directly (limit_req) it bypasses FastAPI's CORS
    # middleware. Re-attach CORS headers so the browser surfaces the 429.
    error_page 429 = @rate_limited;
    location @rate_limited {
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS"  always;
        add_header Access-Control-Allow-Headers "Content-Type"        always;
        add_header Vary                         "Origin"              always;
        add_header Retry-After                  "1"                   always;
        return 429 '{"detail":"rate_limited"}';
    }

    # Throttle public POST endpoints.
    location ~ ^/api/(donations|contact|volunteer) {
        limit_req       zone=api_post burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Rest of the API.
    location /api/ {
        proxy_pass http://nti_api;
        include /etc/nginx/snippets/proxy_common.conf;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA (built by the web container's nginx).
    location / {
        proxy_pass http://nti_web;
        include /etc/nginx/snippets/proxy_common.conf;
    }
}
