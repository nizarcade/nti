# Upstream FastAPI service (internal docker network)
upstream nti_api {
  server api:8090;
  keepalive 16;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 20m;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  # gzip
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml
    font/woff2;

  # Security headers
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

  # Long cache for hashed Vite assets
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Static files (favicons, fonts, etc.) — short cache
  location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot)$ {
    try_files $uri =404;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # API reverse proxy → FastAPI (same-origin, no CORS needed in prod)
  location /api/ {
    proxy_pass http://nti_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";

    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Health endpoint for uptime checks / load balancers
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # SPA fallback — must be last
  location / {
    try_files $uri $uri/ /index.html;
  }
}
